name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      # hls4ml supports Keras 3 / QKeras v3 from 1.4; until its release, the upstream commit the tutorials pin.
      - run: pip install -e '.[testing]' "hls4ml @ git+https://github.com/fastmachinelearning/hls4ml.git@a2abb4d22e7762a870cd46ccf3e07ff6a5622ed5"
      - name: pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
      - name: test
        run: pytest tests -q -p no:randomly --cov --cov-report=term-missing:skip-covered
